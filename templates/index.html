<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APRS Station</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --border:    #30363d;
    --text:      #c9d1d9;
    --muted:     #8b949e;
    --accent:    #58a6ff;
    --green:     #3fb950;
    --red:       #f85149;
    --orange:    #d29922;
    --yellow:    #e3b341;
    --blue-dim:  #1c2a3f;
    --green-dim: #112518;
    --font-mono: 'Courier New', Courier, monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Status Bar ─────────────────────────────────────────── */
  #status-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #status-bar .callsign {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
  }
  #status-bar .freq {
    color: var(--muted);
    font-size: 13px;
  }
  .indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-green  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot-red    { background: var(--red);   box-shadow: 0 0 6px var(--red); }
  .dot-yellow { background: var(--yellow);box-shadow: 0 0 6px var(--yellow); }
  .dot-gray   { background: var(--muted); }
  #uptime { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--font-mono); }
  #audio-test-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  #audio-test-btn:hover { border-color: var(--green); color: var(--green); }
  #audio-test-btn.playing { border-color: var(--green); color: var(--green); }

  /* ── Main body ───────────────────────────────────────────── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Left column: Send + Messages ──────────────────────────── */
  #left-col {
    display: flex;
    flex-direction: column;
    width: 380px;
    min-width: 280px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
  }

  /* ── Send panel ──────────────────────────────────────────── */
  #send-panel {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    flex-shrink: 0;
  }
  #send-panel h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .field-row { margin-bottom: 10px; }
  .field-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field-row input,
  .field-row textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    transition: border-color .15s;
  }
  .field-row input:focus,
  .field-row textarea:focus { border-color: var(--accent); }
  #msg-textarea { height: 64px; }
  #char-count { font-size: 11px; color: var(--muted); text-align: right; margin-top: 3px; }
  #char-count.warn { color: var(--red); }
  #send-btn {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #0d1117;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity .15s;
  }
  #send-btn:disabled { opacity: .4; cursor: not-allowed; }
  #send-btn:not(:disabled):hover { opacity: .85; }

  /* ── Toast ───────────────────────────────────────────────── */
  #toast {
    display: none;
    margin-top: 8px;
    padding: 7px 10px;
    border-radius: 5px;
    font-size: 13px;
  }
  #toast.ok  { background: #1a3a1a; color: var(--green); border: 1px solid var(--green); }
  #toast.err { background: #3a1a1a; color: var(--red);   border: 1px solid var(--red); }

  /* ── Messages panel ──────────────────────────────────────── */
  #messages-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  #messages-panel h2 {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #messages-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .msg-row {
    padding: 8px 16px;
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: background .1s;
  }
  .msg-row:hover { background: rgba(255,255,255,.04); }
  .msg-row.in  { border-left-color: var(--accent); }
  .msg-row.out { border-left-color: var(--green); }
  .msg-row.unread { background: var(--blue-dim); }
  .msg-row.unread .msg-header { font-weight: 700; }
  .msg-header { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .msg-header .arrow { color: var(--accent); }
  .msg-row.out .msg-header .arrow { color: var(--green); }
  .msg-text { font-size: 13px; color: var(--text); word-break: break-word; }
  .msg-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #messages-empty { padding: 20px 16px; color: var(--muted); font-size: 13px; }

  /* ── Packet stream ───────────────────────────────────────── */
  #stream-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }
  #stream-header {
    display: flex;
    align-items: center;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 12px;
  }
  #stream-header h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  #stream-count { font-size: 12px; color: var(--muted); }
  #clear-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  #clear-btn:hover { border-color: var(--text); color: var(--text); }
  #packet-list {
    flex: 1;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 4px 0;
  }
  .pkt-row {
    display: flex;
    align-items: baseline;
    padding: 3px 14px;
    gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,.03);
  }
  .pkt-row:hover { background: rgba(255,255,255,.03); }
  .pkt-time  { color: var(--muted); min-width: 65px; flex-shrink: 0; }
  .pkt-src   { min-width: 90px; flex-shrink: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pkt-type  { min-width: 72px; flex-shrink: 0; font-size: 11px; padding: 1px 5px; border-radius: 3px; text-align: center; }
  .pkt-origin { min-width: 32px; flex-shrink: 0; font-size: 10px; padding: 1px 4px; border-radius: 3px; text-align: center; margin-right: 4px; }
  .origin-rf       { background: #0d2e18; color: #4ade80; }
  .origin-internet { background: #1a1a2e; color: #94a3b8; }
  .pkt-sum   { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  /* Packet type colours */
  .type-position { background: #0d1e40; color: #79b8ff; }
  .type-message  { background: #0d2e18; color: var(--green); }
  .type-weather  { background: #2e200d; color: var(--orange); }
  .type-status   { background: #1e1e2e; color: #c084fc; }
  .type-object   { background: #1e2e2e; color: #67e8f9; }
  .type-other    { background: #1e1e1e; color: var(--muted); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- ── Status Bar ─────────────────────────────────────────────────────── -->
<div id="status-bar">
  <span class="callsign" id="sb-callsign">…</span>
  <span class="freq" id="sb-freq"></span>
  <span class="indicator">
    <span class="dot dot-gray" id="dw-dot"></span>
    <span id="dw-label">Direwolf</span>
  </span>
  <span class="indicator">
    <span class="dot dot-gray" id="is-dot"></span>
    <span id="is-label">APRS-IS</span>
  </span>
  <span id="uptime"></span>
  <button id="audio-test-btn" title="Play a test phrase through the TTS speaker">&#128266; Test Audio</button>
</div>

<div id="main">

  <!-- ── Left column ─────────────────────────────────────────────────── -->
  <div id="left-col">

    <!-- Send Message -->
    <div id="send-panel">
      <h2>&#128228; Send Message</h2>
      <div class="field-row">
        <label for="to-input">To</label>
        <input id="to-input" type="text" placeholder="Callsign" autocomplete="off" spellcheck="false">
      </div>
      <div class="field-row">
        <label for="msg-textarea">Message</label>
        <textarea id="msg-textarea" maxlength="67" placeholder="Type your message…" spellcheck="false"></textarea>
        <div id="char-count">0 / 67</div>
      </div>
      <button id="send-btn">SEND</button>
      <div id="toast"></div>
    </div>

    <!-- My Messages -->
    <div id="messages-panel">
      <h2>&#128203; My Messages</h2>
      <div id="messages-list">
        <div id="messages-empty">No messages yet.</div>
      </div>
    </div>

  </div><!-- /left-col -->

  <!-- ── Packet Stream ────────────────────────────────────────────────── -->
  <div id="stream-panel">
    <div id="stream-header">
      <h2>&#128225; Live Packet Stream</h2>
      <span id="stream-count"></span>
      <button id="clear-btn">Clear</button>
    </div>
    <div id="packet-list"></div>
  </div>

</div><!-- /main -->

<script src="/static/socket.io.min.js"></script>
<script>
"use strict";

// ── State ────────────────────────────────────────────────────────────────────
let myCall = "";
let partnerCall = "";
let packetCount = 0;
const MAX_PACKETS = 100;

// ── Socket.IO ────────────────────────────────────────────────────────────────
const socket = io({ transports: ["websocket", "polling"] });

socket.on("connect",    () => console.log("WS connected"));
socket.on("disconnect", () => console.log("WS disconnected"));

socket.on("packet",  pkt => addPacket(pkt));
socket.on("message", msg => addMessage(msg));
socket.on("status",  st  => applyStatus(st));

// ── Status bar ───────────────────────────────────────────────────────────────
function applyStatus(st) {
  if (st.callsign) {
    myCall = st.callsign;
    document.getElementById("sb-callsign").textContent = st.callsign;
    document.title = "APRS — " + st.callsign;
  }
  if (st.frequency) {
    document.getElementById("sb-freq").textContent = st.frequency.toFixed(3) + " MHz";
  }
  if (st.partner && !document.getElementById("to-input").dataset.touched) {
    partnerCall = st.partner;
    document.getElementById("to-input").value = st.partner;
  }

  const dwDot   = document.getElementById("dw-dot");
  const isDot   = document.getElementById("is-dot");

  dwDot.className = "dot " + (st.direwolf ? "dot-green" : "dot-red");
  document.getElementById("dw-label").textContent = "Direwolf " + (st.direwolf ? "✓" : "✗");

  if (st.aprs_is === true) {
    isDot.className = "dot dot-green";
    document.getElementById("is-label").textContent = "APRS-IS ✓";
  } else if (st.aprs_is === false) {
    isDot.className = "dot dot-red";
    document.getElementById("is-label").textContent = "APRS-IS ✗";
  } else {
    isDot.className = "dot dot-yellow";
    document.getElementById("is-label").textContent = "APRS-IS off";
  }

  if (st.uptime) document.getElementById("uptime").textContent = "up " + st.uptime;
}

// Poll status every 5 s as fallback
function pollStatus() {
  fetch("/api/status").then(r => r.json()).then(applyStatus).catch(() => {});
}
pollStatus();
setInterval(pollStatus, 5000);

// ── Packet stream ────────────────────────────────────────────────────────────
function typeClass(t) {
  const map = { position:"type-position", message:"type-message",
                weather:"type-weather",   status:"type-status",
                object:"type-object" };
  return map[t] || "type-other";
}

function addPacket(pkt) {
  const list = document.getElementById("packet-list");

  const row = document.createElement("div");
  row.className = "pkt-row";
  row.title = pkt.raw || "";
  const isRF = (pkt.origin !== "internet");
  row.innerHTML =
    `<span class="pkt-time">${esc(pkt.timestamp)}</span>` +
    `<span class="pkt-src">${esc(pkt.source)}</span>` +
    `<span class="pkt-type ${typeClass(pkt.type)}">${esc(pkt.type)}</span>` +
    `<span class="pkt-origin ${isRF ? 'origin-rf' : 'origin-internet'}">${isRF ? 'RF' : 'IS'}</span>` +
    `<span class="pkt-sum">${esc(pkt.summary)}</span>`;

  list.insertBefore(row, list.firstChild);
  packetCount++;

  // Trim to MAX_PACKETS — never pause scroll
  while (list.children.length > MAX_PACKETS) {
    list.removeChild(list.lastChild);
  }

  document.getElementById("stream-count").textContent = packetCount + " pkts";
}

document.getElementById("clear-btn").addEventListener("click", () => {
  document.getElementById("packet-list").innerHTML = "";
  document.getElementById("stream-count").textContent = "";
});

// ── Messages panel ────────────────────────────────────────────────────────────
function addMessage(msg) {
  const list = document.getElementById("messages-list");
  const empty = document.getElementById("messages-empty");
  if (empty) empty.remove();

  const isIn = msg.direction === "IN";
  const row = document.createElement("div");
  row.className = "msg-row " + (isIn ? "in" : "out") + (isIn && !msg.read ? " unread" : "");
  if (msg.id) row.dataset.id = msg.id;

  const from = esc(msg.from_call);
  const to   = esc(msg.to_call);
  const arrow = isIn
    ? `<span class="arrow">&#9654;</span> ${from} &rarr; ${to}`
    : `<span class="arrow">&#9664;</span> ${from} &rarr; ${to}`;

  row.innerHTML =
    `<div class="msg-header">${arrow}</div>` +
    `<div class="msg-text">${esc(msg.text)}</div>` +
    `<div class="msg-time">${esc(msg.timestamp)}</div>`;

  if (isIn) {
    row.addEventListener("click", () => markRead(row, msg.id));
  }

  list.insertBefore(row, list.firstChild);
}

function markRead(row, id) {
  if (!id) return;
  fetch("/api/ack/" + id, { method: "POST" })
    .then(() => row.classList.remove("unread"))
    .catch(() => {});
}

// Load existing messages on page load
fetch("/api/messages").then(r => r.json()).then(msgs => {
  // Oldest first so prepend puts newest on top
  [...msgs].reverse().forEach(m => {
    addMessage({
      from_call: m.from_call,
      to_call:   m.to_call,
      text:      m.message_text,
      direction: m.direction,
      timestamp: m.received_at ? m.received_at.split(" ")[1] || m.received_at : "",
      id:        m.id,
      read:      m.read,
    });
  });
}).catch(() => {});

// ── Send message ──────────────────────────────────────────────────────────────
const toInput  = document.getElementById("to-input");
const msgArea  = document.getElementById("msg-textarea");
const charCnt  = document.getElementById("char-count");
const sendBtn  = document.getElementById("send-btn");
const toast    = document.getElementById("toast");

toInput.addEventListener("input", () => { toInput.dataset.touched = "1"; });

msgArea.addEventListener("input", () => {
  const n = msgArea.value.length;
  charCnt.textContent = n + " / 67";
  charCnt.className = n >= 60 ? "warn" : "";
});

sendBtn.addEventListener("click", sendMessage);
msgArea.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendMessage();
});

function sendMessage() {
  const to  = toInput.value.trim().toUpperCase();
  const msg = msgArea.value.trim();

  if (!to)  { showToast("err", "Enter a destination callsign."); return; }
  if (!msg) { showToast("err", "Message cannot be empty.");      return; }
  if (msg.length > 67) { showToast("err", "Message too long (max 67 chars)."); return; }

  sendBtn.disabled = true;
  hideToast();

  fetch("/api/send", {
    method:  "POST",
    headers: { "Content-Type": "application/json" },
    body:    JSON.stringify({ to, message: msg }),
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      showToast("err", data.error);
    } else {
      showToast("ok", "Message sent \u2713");
      msgArea.value = "";
      charCnt.textContent = "0 / 67";
      charCnt.className = "";
    }
  })
  .catch(err => showToast("err", "Network error: " + err))
  .finally(() => { sendBtn.disabled = false; });
}

function showToast(type, text) {
  toast.className = type;
  toast.textContent = text;
  toast.style.display = "block";
  clearTimeout(toast._timer);
  if (type === "ok") {
    toast._timer = setTimeout(hideToast, 3000);
  }
}
function hideToast() {
  toast.style.display = "none";
}

// ── Audio test button ─────────────────────────────────────────────────────────
document.getElementById("audio-test-btn").addEventListener("click", function () {
  const btn = this;
  btn.textContent = "\uD83D\uDD0A Playing\u2026";
  btn.classList.add("playing");
  btn.disabled = true;
  fetch("/api/test_tts", { method: "POST" })
    .then(() => {
      // Re-enable after 6 s — enough time for Piper + aplay to finish
      setTimeout(() => {
        btn.textContent = "\uD83D\uDD0A Test Audio";
        btn.classList.remove("playing");
        btn.disabled = false;
      }, 6000);
    })
    .catch(() => {
      btn.textContent = "\uD83D\uDD0A Test Audio";
      btn.classList.remove("playing");
      btn.disabled = false;
    });
});

// ── Utility ───────────────────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
</script>
</body>
</html>
